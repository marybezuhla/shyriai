# SPDX-License-Identifier: GPL-3.0-or-later
name: Build APK

on:
  push:
    branches: [main]
    # Only documents changed: nothing to build or release.
    paths-ignore: ["**.md", "LICENSE", "docs/**", "fastlane/**"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE", "docs/**", "fastlane/**"]
  workflow_dispatch:

# Nothing gets write access unless a job asks for it below
permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  # From https://github.com/godotengine/godot/releases/download/4.7.2-stable/SHA512-SUMS.txt
  GODOT_SHA512: "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65"
  TEMPLATES_SHA512: "ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079"

jobs:
  # Builds and tests. Runs third-party build code (Godot), so it gets no secrets and no write access.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(tr -d '[:space:]' < version.txt)"
          echo "$V" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$' || { echo "::error::version.txt must be major.minor.patch, got '$V'"; exit 1; }
          # A push to main becomes a release: stop here, before any approval, if this version is already out.
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ] \
             && gh api "repos/${{ github.repository }}/releases/tags/v$V" >/dev/null 2>&1; then
            echo "::error::v$V is already released; raise version.txt first."; exit 1
          fi
          # The release notes are written for this version, not left over from the last one.
          grep -qF "$V" .github/release-notes.md || { echo "::error::.github/release-notes.md does not mention $V"; exit 1; }
          # 1.2.4 -> 10204 (minor and patch stay below 100, checked above)
          IFS=. read -r MA MI PA <<< "$V"
          CODE=$((MA * 10000 + MI * 100 + PA))
          sed -i -E "s/^version\/code=.*/version\/code=$CODE/; s/^version\/name=.*/version\/name=\"$V\"/" app/export_presets.cfg
          sed -i -E "s/^config\/version=.*/config\/version=\"$V\"/" app/project.godot
          grep -E "^version/" app/export_presets.cfg

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Get Godot and its Android templates (checked by SHA-512)
        shell: bash
        run: |
          set -euo pipefail
          B="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" "$B/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o "$RUNNER_TEMP/templates.tpz" "$B/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo "$GODOT_SHA512  $RUNNER_TEMP/godot.zip" | sha512sum -c -
          echo "$TEMPLATES_SHA512  $RUNNER_TEMP/templates.tpz" | sha512sum -c -
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T"
          unzip -q -j "$RUNNER_TEMP/templates.tpz" templates/android_release.apk templates/android_debug.apk templates/version.txt -d "$T"
          ls -l "$T"
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
            "$ANDROID_HOME" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres"

      - name: Import, test the physics and every lesson, then every screen
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path app --import 2>&1 | tee import.log | tail -5
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load" import.log; then echo "::error::Scripts or resources failed to import"; exit 1; fi
          # Each lesson must be passable with the sticks alone, in every mode.
          # A test that hangs (a script error stops it before it quits) fails after the time limit.
          SHYRIAI_PREFS="$RUNNER_TEMP/sim-prefs.json" timeout 600 godot --headless --path app res://tests/sim_test.tscn 2>&1 | tee sim.log || true
          grep -q "SIM OK" sim.log || { echo "::error::Physics or lesson tests failed"; exit 1; }
          SHYRIAI_PREFS="$RUNNER_TEMP/smoke-prefs.json" timeout 900 godot --headless --path app res://tests/smoke.tscn 2>&1 | tee smoke.log || true
          grep -q "SMOKE OK" smoke.log || { echo "::error::Smoke test did not finish"; exit 1; }
          if grep -E "SCRIPT ERROR|^ERROR|Parse Error|leaked" sim.log smoke.log; then echo "::error::Script errors or leaks in the tests"; exit 1; fi

      - name: Build the APK (unsigned)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --path app --export-release "Android" "$PWD/build/shyriai-unsigned.apk" 2>&1 | tee build.log
          test -s build/shyriai-unsigned.apk || { echo "::error::No APK was produced"; exit 1; }
          ls -l build/

      - name: Check permissions (no internet, only what is expected)
        shell: bash
        run: bash .github/check-permissions.sh build/shyriai-unsigned.apk

      - name: Prepare build log
        if: always()
        shell: bash
        run: |
          mkdir -p log
          { echo "run ${{ github.run_number }} ${{ job.status }}"; cat import.log 2>/dev/null | tail -20; grep -E "fail|FAIL" sim.log 2>/dev/null; cat sim.log 2>/dev/null | tail -40; cat smoke.log 2>/dev/null | tail -80; echo ----; tail -150 build.log 2>/dev/null; cat permissions.txt 2>/dev/null; } > log/build.log || true
          # The first errors as annotations, so they show without opening the log.
          { grep -hE "ERROR|Error|error:" smoke.log build.log 2>/dev/null | head -15 \
            | sed -E 's/%/%25/g' | while IFS= read -r l; do echo "::warning title=build::$l"; done; } || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: build-log
          path: log/
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shyriai-unsigned
          path: build/shyriai-unsigned.apk
          retention-days: 14

  # Signs. Only for main, only in the "release" environment (needs the owner's approval), and with
  # no Godot or other third-party build code: just the Android SDK's own zipalign and apksigner.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.secrets.outputs.ready }}
    steps:
      - name: Check that signing secrets exist
        id: secrets
        env:
          KEYSTORE: ${{ secrets.SHYRIAI_KEYSTORE }}
          STORE: ${{ secrets.SHYRIAI_KEYSTORE_PASSWORD }}
          KEY: ${{ secrets.SHYRIAI_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$STORE" ] && [ -n "$KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Signing secrets are not set in the release environment; nothing is published."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            version.txt
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: shyriai-unsigned
          path: unsigned

      # The build job ran third-party code: check the APK's permissions again here, before signing,
      # in a step that has no secrets.
      - name: Check permissions again
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: bash .github/check-permissions.sh unsigned/shyriai-unsigned.apk

      - name: Sign
        if: steps.secrets.outputs.ready == 'true'
        env:
          KEYSTORE: ${{ secrets.SHYRIAI_KEYSTORE }}
          STORE: ${{ secrets.SHYRIAI_KEYSTORE_PASSWORD }}
          KEY: ${{ secrets.SHYRIAI_KEY_PASSWORD }}
        shell: bash
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # The keystore lives only in the release environment's secrets, not in the repository.
          # Spaces or line breaks picked up while pasting are dropped; base64 has none.
          printf %s "$KEYSTORE" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/shyriai.jks" \
            || { echo "::error::SHYRIAI_KEYSTORE is not valid base64. Paste the whole line again."; exit 1; }
          # A JKS keystore starts with the bytes FE ED FE ED (base64 "/u3+7Q").
          if [ "$(head -c 4 "$RUNNER_TEMP/shyriai.jks" | od -An -tx1 | tr -d ' \n')" != "feedfeed" ]; then
            echo "::error::SHYRIAI_KEYSTORE does not hold the keystore. It must start with /u3+7Q: paste the whole line again."
            rm -f "$RUNNER_TEMP/shyriai.jks"; exit 1
          fi
          mkdir -p out
          "$BT/zipalign" -P 16 -f 4 unsigned/shyriai-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          OUT="out/shyriai-$(tr -d '[:space:]' < version.txt).apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/shyriai.jks" --ks-type JKS --ks-key-alias shyriai \
            --ks-pass env:STORE --key-pass env:KEY --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/shyriai.jks"
          # The certificate must be exactly Shyriai's own
          "$BT/apksigner" verify --print-certs "$OUT" | tee certs.txt
          if ! tr -d ' ' < certs.txt | grep -qi "SHA-256digest:bf06a3a227bb1032dcb141c89293858072a5a00af2bf70394a449eb325ff2e1f"; then
            echo "::error::Unexpected signing certificate"; exit 1
          fi

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/shyriai.jks"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: shyriai-signed
          path: out/*.apk
          retention-days: 7

  # Publishes the signed APK. Never sees the signing key; uses only GitHub's own gh tool.
  publish:
    needs: release
    if: needs.release.outputs.signed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: |
            .github/release-notes.md
            version.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: shyriai-signed
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The same version can be released only once: the tag already exists otherwise.
          V="$(tr -d '[:space:]' < version.txt)"
          gh release create "v$V" out/*.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Shyriai $V" --notes-file .github/release-notes.md --latest
